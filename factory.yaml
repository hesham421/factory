# ════════════════════════════════════════════════════════════════════════════
# factory.yaml — THE single source of truth of the Governance Factory (C1)
# ----------------------------------------------------------------------------
# Every factory fact lives here and ONLY here: stages, passes, gates, lanes,
# paths, naming, ID grammar, marker grammar, tracks, repos, review rubric.
# Domain facts (vocabulary, phases, stack, languages …) live in
# profiles/<id>.yaml and are validated against profiles/_schema.yaml.
#
# Nothing in engines/, shared/, reviewers/, governance-tools/ may restate a
# value from this file — `gov.py lint` enforces that. Generated files
# (SKILL.md, README pipeline map, START-HERE, contract tables) are produced
# by `gov.py render` from this file + the active profile.
# ════════════════════════════════════════════════════════════════════════════
schema_version: 6

factory:
  name: governance-factory
  boundary: analysis-only          # never implements, never audits code, never runs tests in the line
  # No active profile here: the factory is a pure, stateless tool. The active
  # project's `project.yaml` names its profile; GOV_PROFILE overrides it.

# ── Paths ───────────────────────────────────────────────────────────────────
# Two roots. Tool paths resolve against this checkout; every key listed under
# `external.keys` resolves against the PROJECT checkout (`project:` below) —
# that is where everything generated or project-variable lives: the profiles,
# the analysis, the decisions, the delivered packages. Switching projects is
# pointing at another project repo; nothing here changes.
paths:
  schema: profiles                 # tool: profiles/_schema.yaml — validation logic, not data
  profiles: profiles               # project: the domain profile(s) — <id>.yaml + <id>/knowledge/
  domain: analysis/domain          # project: domain-profile.md (the entry gate)
  platform: analysis/platform      # project: project-registry.md, system tests, PROJECT-OVERVIEW.md
  modules: analysis/modules        # project: analysis/modules/{MOD}/[vN/]
  decisions: analysis/decisions    # project: analysis/decisions/{MOD}/ADR-*
  overview: analysis/platform/PROJECT-OVERVIEW.md   # project: the rendered profile summary + phase tables
  engines: engines
  standalone: standalone
  shared: shared
  reviewers: reviewers
  commands: .claude/commands
  tools: governance-tools
  templates: governance-tools/templates
  # The ONLY statement of the tool/project boundary — `config.dir()` reads it
  # and nothing else does.
  external:
    keys: [profiles, domain, platform, modules, decisions, overview]
  module:
    state_dir: _state            # generated current-state files (read by engines)
    inputs_dir: _inputs          # inputs fetched back from consumer repos
    input_meta: "{file}.meta.json"   # beside each fetched input: the shared-repo commit it was
                                     # read at, its digest, when — so a pass-2 plan can prove
                                     # which published surface it was built against
    manifest_file: manifest.json
    analyze_report: "_state/analyze-{stage}.md"
    gate_record: "_state/gate-pass-{pass}.md"
    change_manifest: "change-manifest.md"

# ── Naming — every pattern in one place ────────────────────────────────────
naming:
  module_code: "{MOD}"                       # upper-case module code
  version_folder: "v{version}"               # v1 = module base folder (no subfolder)
  stage_folder: "{stage_folder}"             # stage id with '.'/'-' → '_'  (P0.5 → P0_5)
  tag: "{mod}-v{version}"
  commit:
    stage: "{stage}: [{MOD}] v{version} — {summary}"
    gate: "gate(pass-{pass}): [{MOD}] v{version} {verdict}"
    state: "state: [{MOD}] v{version} — regenerated current state"
    version: "version: [{MOD}] v{version} created"
  current_state_file: "current-{artifact}"   # + the artifact's own extension
  adr_file: "ADR-{MOD}-{seq:03d}.md"

# ── Human decision points (the ONLY two per module version, + PRD approval) ─
gates:
  - id: prd-approval
    after: P0.5
    type: human-approval           # the user approves the PRD file itself
    blocks: [P1]
  - id: pass-1
    after: P3.1
    type: review                   # one review per pass (scorecard + analyze report)
    lane: review-pass              # two read-only reviewers argue the same brief and converge on one scorecard
    requires_analyze: clean        # no finding at a severity in `analyze.blocking`
    requires_feedback: answered    # no consumer gap the factory has not answered
                                   # (feedback.status → open/human/unrecognised).
                                   # Waivable by a named human, per item: `gov.py waive-feedback`
    on_revise: merge-review-notes  # lane used to apply findings; re-gate once, then escalate
  - id: pass-2
    after: P3.2
    type: review
    lane: review-pass
    requires_analyze: clean
    requires_feedback: answered    # no consumer gap the factory has not answered
                                   # (feedback.status → open/human/unrecognised).
                                   # Waivable by a named human, per item: `gov.py waive-feedback`
    on_revise: merge-review-notes

# ── Stages — the governed pipeline (order = run order) ─────────────────────
# questions: allowed | forbidden   (C6 — enforced by the orchestrator)
# dialogue : true → the lane's implementer list runs a converging dialogue. Such a
#            stage names `analysis-dialogue`: two implementers alternate, so a
#            PROPOSAL is answered by a different model than the one that made it.
stages:
  - id: domain-profile
    title: Domain Profile
    pass: pre
    once_per: platform
    questions: allowed
    dialogue: true
    lane: analysis-dialogue
    research: web                  # absorbs the former idea-draft step
    inputs: [raw-idea, "platform-brief?"]
    produces:
      - {artifact: domain-profile, file: "domain-profile.md", dir: domain}
    owns_ids: []
    next: P-1
  - id: P-1
    title: Registry & Steering Builder
    pass: bootstrap
    once_per: platform
    questions: forbidden
    lane: analysis
    inputs: [domain-profile]
    produces:
      - {artifact: project-registry, file: "project-registry.md", dir: platform}
    owns_ids: []
    next: P0
  - id: P0
    title: Platform Inception
    pass: 1
    questions: allowed
    dialogue: true
    lane: analysis-dialogue
    inputs: [domain-profile, project-registry]
    produces:
      - {artifact: platform-summary, file: "platform-summary.md"}
      - {artifact: module-registry, file: "module-registry-{mod}.md"}
      - {artifact: business-policies, file: "business-policies-{mod}.md"}
    owns_ids: [POL]
    next: P0.5
  - id: P0.5
    title: PRD
    pass: 1
    questions: allowed             # LAST stage where questions are allowed
    dialogue: true
    lane: analysis-dialogue
    inputs: [platform-summary, module-registry, business-policies]
    produces:
      - {artifact: prd, file: "prd-{mod}.md"}
    owns_ids: [US]
    next: P1
  - id: P1
    title: SRS
    pass: 1
    questions: forbidden
    lane: analysis
    inputs: [prd, domain-profile, project-registry]
    produces:
      - {artifact: srs, file: "srs-{mod}.md"}
      - {artifact: registry-srs, file: "registry-srs-{mod}.md", registry: true}
    owns_ids: [REQ, AC, ENT, RULE, SCR-REQ]
    requirement_format: EARS
    next: P2
  - id: P2
    title: Database
    pass: 1
    questions: forbidden
    lane: analysis
    inputs: [srs, registry-srs]
    produces:
      - {artifact: db-script, file: "db-script-{mod}.md"}
      - {artifact: registry-db, file: "registry-db-{mod}.md", registry: true}
    owns_ids: [DBF, XM]
    next: P3.1
  - id: P3.1
    title: Backend Execution Plan
    pass: 1
    track: backend
    questions: forbidden
    lane: analysis
    inputs: [srs, db-script, registry-srs, registry-db]
    produces:
      - {artifact: backend-execution-plan, file: "backend-execution-plan-{mod}.md", plan: exec, track: backend}
      - {artifact: registry-exec-be, file: "registry-exec-be-{mod}.md", registry: true}
    owns_ids: [API, QR]
    next: gate:pass-1
  - id: P3.2
    title: Frontend — UX Design + Execution Plan     # P2.5 + P3.2 merged
    pass: 2
    track: frontend
    questions: forbidden
    lane: analysis
    inputs: [srs, prd, api-docs, registry-srs, registry-exec-be]
    produces:
      - {artifact: flow-diagram, file: "flow-diagram-{mod}.md"}
      - {artifact: ui-ux-spec, file: "ui-ux-spec-{mod}.md"}
      - {artifact: frontend-execution-plan, file: "frontend-execution-plan-{mod}.md", plan: exec, track: frontend}
      - {artifact: registry-exec-fe, file: "registry-exec-fe-{mod}.md", registry: true}
    owns_ids: [UXD, SCR]
    next: gate:pass-2

passes:
  "1":
    stages: [P0, P0.5, P1, P2, P3.1]
    track: backend
    then: [gate:pass-1, split]
    session: bundled               # all stages in ONE delegate session, one commit per stage
  "2":
    stages: [P3.2]
    track: frontend
    required_inputs: [api-docs]    # written by the backend into the shared repo (hard gate)
    then: [gate:pass-2, split, tag]
    session: bundled

# ── Standalone stages — OUTSIDE the line, on demand, never a gate ───────────
standalone:
  - id: test-gen
    title: Test Generation
    lane: test-gen
    questions: forbidden
    scoped: true                   # supports `run-standalone --module|--modules|--scope project`
                                    # (gov.py routes on this flag, never on a stage-id literal — C2)
    inputs: [srs, "backend-execution-plan?", "frontend-execution-plan?", registry-srs, "registry-db?", "registry-exec-fe?"]
    produces:
      - {artifact: backend-test-plan, file: "backend-test-plan-{mod}.md", plan: test, track: backend}
      - {artifact: frontend-test-plan, file: "frontend-test-plan-{mod}.md", plan: test, track: frontend}
      - {artifact: test-execution-manifest, file: "test-execution-manifest-{mod}.md", optional: true}
      - {artifact: system-test-index, file: "system-test-index-{profile}.md", dir: platform, optional: true}
    owns_ids: [TC]
    derives_from: AC               # every TC cites the AC it was derived from; integration scope also
                                    # derives TC from XM (backend) and UXD (frontend) — ids.atoms.TC.traces_to
  - id: api-verify
    title: API Verification (post-implementation)
    lane: analysis
    questions: forbidden
    inputs: [api-docs, "test-execution-manifest?"]
    produces:
      - {artifact: api-verify-script, file: "api-verify-{mod}.py"}
      - {artifact: api-verify-report, file: "api-verify-report-{mod}.md"}
    owns_ids: []

# ── Inputs that come back from a track ──────────────────────────────────────
# `partition` names the project partition the producing track publishes into
# (project.partitions below) — cmd_fetch_inputs() reads it there, folds it, and
# records the project commit it read it at.
inputs:
  api-docs:
    partition: api-docs
    file: "api-docs-{mod}.md"
    # The backend publishes api-docs as a FOLDER (an index plus one file per
    # endpoint group); this stage reads ONE file. `merge` is how the folder
    # becomes that file — deterministically, so re-fetching an unchanged source
    # reproduces the same bytes and a diff only ever shows a real change.
    # Without it `fetch-inputs` copied a path that does not exist and the
    # consolidation was done by hand, annex and all.
    merge:
      lead: index.md          # emitted first when present
      include: "**/*.md"      # then every other file, ordered by relative path
      # a hand-written companion the fetch must never overwrite (see `binding`)
      keep_alongside: "api-docs-binding-{mod}.md"

# ── ID grammar — core atoms (profiles may ADD atoms, never redefine these) ──
ids:
  seq_width: 3
  pattern: "{prefix}-{MOD}-{seq}"
  atoms:
    POL:  {owner: P0,        title: business policy}
    US:   {owner: P0.5,      title: user story,            traces_to: [POL]}
    REQ:  {owner: P1,        title: requirement (EARS),    traces_to: [US],       requires: [AC]}
    AC:   {owner: P1,        title: acceptance criterion (Given/When/Then), traces_to: [REQ]}
    ENT:  {owner: P1,        title: entity}
    RULE: {owner: P1,        title: business rule,         traces_to: [REQ]}
    DBF:  {owner: P2,        title: db field,              traces_to: [REQ, ENT]}
    XM:   {owner: P2,        title: cross-module dependency, traces_to: [REQ]}
    API:  {owner: P3.1,      title: api endpoint,          traces_to: [REQ, DBF]}
    QR:   {owner: P3.1,      title: query reference}
    UXD:  {owner: P3.2,      title: ux decision,           traces_to: [REQ, AC]}
    SCR:  {owner: P3.2,      title: screen,                traces_to: [REQ, UXD]}
    SCR-REQ: {owner: P1,     title: screen requirement,    traces_to: [REQ]}
    TC:   {owner: test-gen,  title: test case,             traces_to: [AC, XM, UXD]}
    ADR:  {owner: any,       title: analysis decision record}
    CS:   {owner: versioning,title: change set}
  ears:
    patterns:
      ubiquitous:   "^The system shall "
      state:        "^While .+, the system shall "
      event:        "^When .+, the system shall "
      optional:     "^Where .+, the system shall "
      unwanted:     "^If .+, then the system shall "
    # a REQ whose text matches none of these is a contract violation (analyze: CRITICAL)

# ── Marker grammar — what the toolkit parses; phase KEYS come from the profile
markers:
  schema_version: 2
  syntax: html-comment              # <!-- KIND:ID:START [key=value …] -->  …  <!-- KIND:ID:END -->
  attributes: [traces]              # traces=REQ-ORG-012,DBF-ORG-044
  kinds:
    PHASE: {level: 1, allowed_parents: [],            keys_from: "profile.tracks.<track>.plans.<plan>.phases"}
    SUB:   {level: 2, allowed_parents: [PHASE],       qualified_by_phase: true}
    API:   {level: 3, allowed_parents: [PHASE, SUB],  atom: API, tracks: [backend]}
    XM:    {level: 3, allowed_parents: [PHASE, SUB],  atom: XM,  tracks: [backend]}
    TC:    {level: 3, allowed_parents: [PHASE, SUB],  atom: TC,  plans: [test]}
  rules:
    unknown_phase: refuse           # never skip silently (C3)
    sub_unqualified_exempt_plans: [test]
    split_unit: [SUB, PHASE]        # never an atom
    verify: sha256                  # content-hash verification of every atom after split
  autofix:
    phase_key_normalise: true       # '+', '_', ' ', '--' → '-' when it maps to exactly one canonical key
    qualify_bare_sub: true

# ── Tracks ──────────────────────────────────────────────────────────────────
# `repo:` names this track's consumer repository — a key of the PROJECT's
# `project.yaml → repos` (named, not inferred: F-12). `partition` is the project
# partition the track WRITES (its execution state); `delivery` is the partition
# the factory splits its packages INTO, which the track reads.
tracks:
  backend:
    repo: backend
    partition: backend
    delivery: backend-packages
    pass: "1"
    exec_stage: P3.1
    packages: {exec: backend-execution, test: backend-test}
  frontend:
    repo: frontend
    partition: frontend
    delivery: frontend-packages
    pass: "2"
    exec_stage: P3.2
    packages: {exec: frontend-execution, test: frontend-test}

# ── The project repo — one per product; the factory drives any of them ──────
# Everything generated or project-variable lives in the project repo: its
# `project.yaml` (user-edited: the active profile id, the consumer repos with
# their urls and checkout hints — the factory never writes it), its profiles,
# its analysis and decisions, the packages delivered to its tracks, and the
# tracks' own partitions. Every consumer mounts it as a submodule and pins a
# commit. This block holds only how the factory FINDS a project and how the
# partitions are laid out — data, shared by every project.
project:
  file: project.yaml
  checkout_env: GOV_PROJECT_CHECKOUT
  checkout_default: "governance-shared"         # a checkout of its OWN inside this folder (git-ignored here,
                                                # never a submodule) — kept in view, never carried by the tool
  # One entry per WRITER — GOVERNANCE-SHARED-DESIGN.md §3's ownership table in
  # the form the tools address. An entry carrying `{MOD}` is per-module; one
  # without it is not, and that is how the tools tell them apart rather than by
  # recognising a name. `writer` is read, not just documented: it is what stops
  # a factory regeneration from clearing a path a track wrote, and a delivery
  # partition nested inside a track's partition is the factory's because the
  # DEEPEST match decides (CODEOWNERS reads it the same way). `readers` widens
  # who may see it (`gov.py sparse`); the default is its own writer.
  partitions:
    platform:          {path: "platform",                        writer: factory, readers: all}
    analysis:          {path: "analysis/modules/{MOD}",          writer: factory}   # what each track may SEE of it is
                                                                                    # derived per stage (gov.py sparse)
    api-docs:          {path: "backend/modules/{MOD}/api-docs",  writer: backend, readers: all}
    backend-packages:  {path: "backend/modules/{MOD}/packages",  writer: factory, readers: [backend]}
    frontend-packages: {path: "frontend/modules/{MOD}/packages", writer: factory, readers: [frontend]}
    backend:           {path: "backend/modules/{MOD}",           writer: backend}
    frontend:          {path: "frontend/modules/{MOD}",          writer: frontend}
  # how `new-project` names a consumer repo's checkout hint (project.yaml → repos)
  consumer_env: "GOV_{REPO}_CHECKOUT"
  consumer_default: "../{repo}"
  # factory publications and where the project keeps them (read by every consumer)
  receives:
    modules-registry: "platform/modules-registry.json"
    profile-summary: "platform/profile-summary.json"

# ── Publications — DERIVED by the factory, written into the project repo ────
# Every consumer reads the one copy inside the project repo it mounts; nothing is
# copied into a consumer's own tree, and no consumer hand-maintains a fact the
# factory can derive. `project.receives.<publication>` is the path.
publications:
  modules-registry:
    builder: modules_registry      # gov.py::_PUBLICATION_BUILDERS — lint checks the name resolves
    derived_from: filesystem       # same authority as versioning.authority
    preserve: [description, registered_at]   # fields the factory does not own: carried over, never regenerated
    additive: true                 # a module present in a consumer's copy but unknown here is KEPT, never dropped

  # Every FACTORY fact a consumer needs in order to set a module up: the active
  # profile's id, where its governance sits, and each track's ordered phase list.
  # Without this a consumer generator has to restate them — and both of them did,
  # which is F-14: a phase added to the profile was scanned into `phases` and
  # silently absent from `gated_by_phases`, so the test phase ran without it.
  # Derived wholly from the profile; nothing here is a consumer's to keep.
  profile-summary:
    builder: profile_summary
    derived_from: profile

# ── Feedback — what a consumer records FOR the factory to answer ────────────
# The factory writes the plan. The consumer discovers, while implementing it,
# what the plan could not know: an endpoint the api-docs never published, a
# field named two ways, a cross-module dependency with no counterpart. That
# discovery has to reach the factory or it reaches nobody — SEC gained a whole
# requirement inside a delivered copy and the factory never saw it (F-23).
#
# The consumer records into ITS OWN partition, so one writer per path still
# holds; the factory READS and never writes here. `gov.py feedback` is the read.
feedback:
  file: execution-state.json         # inside project.partitions.<tracks.<t>.partition>
  channels:                          # each is a list of objects in that file
    api_doc_gaps: {label: "API gap",     key: endpoint}
    blocked:      {label: "blocked",     key: id}
    deferred_xm:  {label: "deferred XM", key: id}
  status:
    field: resolution
    # The first word of `resolution`, case- and punctuation-insensitive. A word
    # that is in none of these lists is reported UNRECOGNISED, never bucketed by
    # guess: the whole point is that the factory learns what it does not know.
    open:   [OPEN, DEFERRED, PENDING]        # the factory still owes an answer
    closed: [RESOLVED, CLOSED, IMPLEMENTED]  # the consumer settled it in code
    human:  [HUMAN, ADR]                     # needs a decision, not a plan edit

# ── Runner — how a brief reaches a model (dispatch.run_round) ───────────────
# `cmd` runs the template once per round with the placeholders filled;
# `manual` writes the brief and stops for the operator (exit 2); `fake` is the
# test hook. The adapter below is the shipped template for the claude-delegate
# relay; the README renders the exact exports from this block.
runner:
  env: GOV_RUNNER                        # cmd | manual | fake
  cmd_env: GOV_RUNNER_CMD                # the command template, run once per round
  placeholders: [brief, lane, model, read_only_flag, out, implementer, provider, effort]
  required: [model]                      # a template without {model} is refused — a dialogue lane
                                         # alternates implementers, and a lane-name-only mapping
                                         # would collapse the debate to one model
  adapter: governance-tools/runner/claude_delegate.sh
  adapter_args: "{brief} {lane} {model} {read_only_flag} {out}"
  relay_env: GOV_DELEGATE_RELAY          # overrides the adapter's search for relay.mjs
  relay: delegate-skills/skills/claude-delegate/scripts/relay.mjs   # the claude-delegate skill's relay;
                                         # the adapter also searches every parent's .agents/skills/ and ~/.agents/skills/

# ── Delegate lanes — model/effort per reasoning step (implementers = list) ──
# Every lane id here is also a lane the delegate setup must know by the SAME
# name (`$delegate-setup` — see the README's operator steps): the runner passes
# {lane} through, and the delegate's own dials (effort, timeout, read-only)
# key on it. {model} is passed explicitly per round, because a dialogue lane
# alternates implementers and a lane-name-only mapping would collapse the
# debate to one model.
lanes:
  analysis:
    implementers: ["claude:opus"]
    effort: high
  analysis-dialogue:                   # the `questions: allowed` stages (domain-profile, P0, P0.5):
    implementers: ["claude:opus", "claude:sonnet"]   # two models alternate — a PROPOSAL is answered
    effort: high                                     # by a different model than the one that made it
    dialogue:
      max_rounds: 4
      converge_on: mutually-acceptable # not perfection — the bar the user set. Closed in-dialogue;
      output: resolved-decisions       # every DECISION: block becomes an ADR (dispatch.persist_decisions)
  review-pass:                         # the gate: two READ-ONLY reviewers argue one brief
    implementers: ["claude:sonnet", "claude:opus"]
    effort: medium
    read_only: true                    # reviewer never edits or commits
    dialogue:
      max_rounds: 2                    # round 1 scores; round 2 answers it and returns the merged card
      converge_on: merged-scorecard
      output: merged-scorecard
  merge-review-notes:
    implementers: ["claude:sonnet"]
    effort: low
  test-gen:
    implementers: ["claude:opus"]
    effort: high                       # a dedicated lane so its model can be swapped independently
                                        # of `analysis` — same shape, own identity (factory.yaml lanes)

# ── Forward references — what a stage cannot resolve at its own stage ──────
# A planning stage runs before any implementation exists, so a name it invents for
# an implementation artifact is a guess. Printed in a table of facts, a guess is
# indistinguishable from a decision and the reader inherits it as one — 14 of 27
# rows in one shipped contract table named types that never existed. A cell a stage
# cannot resolve carries this token; a later stage that CAN resolve it fills it from
# the built artifact. WHICH columns forward-reference is a project fact
# (profile.forward_columns); the token itself is a factory fact, agreed once here.
forward_reference:
  proposed_token: "(proposed)"

# ── Analyze — severity vocabulary and the blocking policy ──────────────────
# The one policy that decides what ships, and the one factory fact that used to
# live as a literal in Python instead of here (analyze.py's severity map and its
# `clean` predicate, gov.py's lint verdict). Ordered, MOST SEVERE FIRST: rank 0
# is what a check reaches for when it has nothing else to say, and the severity
# a contract clause is charged with when it names one this list does not declare.
# `blocking` is the set that closes a stage or a gate. Narrow it and findings
# become advisory; every defect that shipped from this factory was detected and
# then ignored because MAJOR was not in this set.
analyze:
  severities: [CRITICAL, MAJOR, MINOR]
  blocking: [CRITICAL, MAJOR]
  # ── Maturity — is the analysis MATURE, not merely consistent? ─────────────
  # Every contract clause asks whether a reference is shaped right, resolves,
  # or is complete against another artifact. None asked whether the text a
  # human wrote is text the next stage can act on: a requirement resting on
  # "as appropriate", an acceptance criterion whose Then can never fail, an
  # entity nothing ever deletes, a story with no unwanted-behaviour path, a
  # screen with no empty state, a glossary term spelled three ways. The gate
  # reviewer saw these; the machine did not. The clauses below fire at ONE
  # severity — this knob, cited by the contract as `severity:
  # analyze.maturity_severity` — MINOR by default: they inform the reviewer,
  # they do not close a gate. Raise it here and every one of them blocks.
  maturity_severity: MINOR
  maturity:
    # words two implementers read two ways — per language; a profile ADDS its
    # own under `review.ambiguity_lexicon` (never replaces these)
    ambiguity_lexicon:
      en: [etc, "as appropriate", "as needed", "as required", "and/or", appropriate, adequate,
           "user-friendly", fast, quickly, efficient, easy, simple, "if possible", "where possible",
           possibly, may, might, should, could, some, several, various, many, few, normally, usually,
           typically, generally, flexible, robust, reasonable, sufficient, minimal, optimal,
           "best effort", relevant, timely, "in a timely manner", intuitive, seamless, "and so on"]
      ar: [إلخ, "حسب الحاجة", "حسب الاقتضاء", "بشكل مناسب", مناسب, ملائم, سريع, بسرعة, سهل, بسيط,
           "إن أمكن", "قدر الإمكان", ربما, بعض, عدة, مختلف, كثير, قليل, عادة, غالباً, غالبا,
           مرن, كافٍ, كاف, معقول, "أفضل جهد", "ذات صلة", "وما إلى ذلك", "وغيرها"]
    # a Then-clause is measurable when it carries a number, an id, a
    # `name=value`, a quoted literal — or one of these outcome verbs (stems:
    # an inflection may follow — create → creates / created / creating)
    measurable:
      en: [create, record, store, save, reject, refuse, return, display, show, set, mark, send,
           delete, remove, deactivate, activate, update, generate, block, prevent, allow, redirect,
           log, notify, compute, calculate, increment, decrement, validate, raise, fail, succeed,
           exist, contain, equal, list, open, close, post, reverse, reopen, lock, unlock, assign,
           revoke, grant, deny, persist, publish, archive, restore, expire, disable, enable]
      ar: [ينشئ, يسجل, يخزن, يحفظ, يرفض, يعيد, يعرض, يضبط, يرسل, يحذف, يزيل, يعطل, يفعل, يحدث,
           يولد, يمنع, يسمح, يحول, يحتسب, يحسب, يزيد, ينقص, يتحقق, يفشل, ينجح, يحتوي, يساوي,
           يفتح, يغلق, يرحل, يعكس, يقفل, يمنح, يلغي, ينشر, يؤرشف, يستعيد, ينتهي]
    # the operation groups an entity's requirements must cover (verb stems, per language)
    crud:
      create: {en: [create, add, register, insert, record, open, issue, generate, submit, post, upload, enrol, enroll, define],
               ar: [إنشاء, ينشئ, إضافة, يضيف, تسجيل, يسجل, فتح, يفتح, إصدار, يصدر, تعريف, يعرف]}
      read:   {en: [read, view, list, search, retrieve, display, show, query, browse, filter, report, export, get, fetch, lookup, "look up", print],
               ar: [عرض, يعرض, بحث, يبحث, استعلام, يستعلم, قراءة, يقرأ, قائمة, تصفية, تقرير, استرجاع, يسترجع, طباعة]}
      update: {en: [update, edit, modify, change, rename, reassign, move, adjust, correct, amend, reorder, set, mark, transition, approve, reopen],
               ar: [تعديل, يعدل, تحديث, يحدث, تغيير, يغير, "إعادة تسمية", تصحيح, يصحح, ضبط, يضبط, اعتماد, يعتمد]}
      delete: {en: [delete, remove, deactivate, archive, cancel, void, reverse, close, revoke, disable, retire, withdraw, purge, expire],
               ar: [حذف, يحذف, تعطيل, يعطل, إلغاء, يلغي, أرشفة, يؤرشف, إغلاق, يغلق, عكس, يعكس, سحب, يسحب, إبطال, يبطل]}
    # the line of a screen block that lists its states (engines/P3.2 renders it), and what it must name
    screen_states:
      label: States
      required: [empty, loading, error]
  # ── Coverage — the traceability ratios every report carries ──────────────
  # Computed from the traceability matrix `gov.py state` writes, so the report,
  # the gate record and the module's execution state (manifest.json → status)
  # all quote the same number. `from` is an atom; a subject counts as covered
  # when any record of a `to` atom traces to it.
  coverage:
    - {id: us-req,  from: US,  to: [REQ]}
    - {id: req-ac,  from: REQ, to: [AC]}
    - {id: req-api, from: REQ, to: [API]}
    - {id: req-ux,  from: REQ, to: [UXD, SCR]}

# ── Review rubric (ISO/IEC/IEEE 29148 attributes) used by every gate ────────
review:
  rubric: [unambiguous, verifiable, complete, consistent, singular, feasible, traceable]
  scale: {min: 0, max: 3}
  pass_threshold: 2                  # every attribute must score ≥ threshold to APPROVE
  verdicts: [APPROVE, REVISE, ESCALATE]
  revise_max: 1                      # a second REVISE on the same finding → ESCALATE to the human

# ── Ambiguity rule after PRD approval (no new questions) ────────────────────
ambiguity:
  non_breaking: {action: adr, then: continue}   # decisions/<MOD>/ADR-… with the chosen best practice
  breaking:     {action: adr, status: BLOCKED, then: stop}

# ── Dialogue — how a converging lane records what it settled ────────────────
# A dialogue closes its open points inside the brief (C6). What it closed used
# to live only in the round transcripts under _state/briefs/ — a decision the
# reviewer could not find and the next version could not cite. Every DECISION
# block of a converged dialogue is now persisted as an ADR (naming.adr_file)
# into the decisions partition, with this status, by dispatch.persist_decisions.
dialogue:
  proposal_token: "PROPOSAL:"          # round 1 opens a point
  decision_token: "DECISION:"          # a later round closes it — title on the line, reasoning below
  adr_status: RESOLVED-IN-DIALOGUE

# ── Versioning ──────────────────────────────────────────────────────────────
versioning:
  authority: filesystem              # vN/ folders + tags; no registry-based version
  delta_only: true                   # vN holds only ADDED/MODIFIED/REMOVED + change-manifest
  current_state: generated           # gov.py state → _state/current-*.md ; engines read _state only
  freeze_previous: tag

# ── Commands (thin wrappers over gov.py; rendered into .claude/commands) ────
commands:
  - {id: bootstrap,     runs: "run-stage P-1",          args: "[--profile ID]"}
  - {id: analyze-pass1, runs: "run-pass 1",             args: "MOD [--version N|--new]"}
  - {id: analyze-pass2, runs: "run-pass 2",             args: "MOD --version N"}
  - {id: reanalyze,     runs: "analyze --all-modules", args: "[--scope all|stage:ID|pass:N|gate:ID]"}   # sweep after a rules change
  - {id: gate,          runs: "gate",                   args: "<1|2> MOD --version N [--model …] [--effort …]"}
  - {id: micro-feature, runs: "version --new + run-pass 1 + run-pass 2 (delta)", args: "MOD \"<free text>\""}
  - {id: verify-split,  runs: "verify-split",          args: "MOD --track T [--plan P] [--version N]"}   # re-run the split digest compare on demand
  - {id: link-repos,    runs: "edit the project's project.yaml repos", args: ""}
  - {id: new-project,   runs: "new-project",            args: "DIR --id ID [--name NAME] [--profile PID]"}   # scaffold a project repo
  - {id: new-domain,    runs: "new-domain",             args: "ID"}   # add a second profile to the current project
  - {id: render,        runs: "render",                 args: ""}
  - {id: lint,          runs: "lint",                   args: "[--profile ID]"}
  - {id: test-gen,      runs: "run-standalone test-gen",  args: "--module MOD (or --modules A,B,... or --scope project) [--version N]"}
  - {id: api-verify,    runs: "run-standalone api-verify", args: "MOD --version N"}

# ── Lint — Constitution enforcement (C1–C5) ─────────────────────────────────
lint:
  generated_marker: "<!-- GENERATED by `gov.py render` from factory.yaml + profile — do not edit by hand -->"
  exempt_paths: [history, profiles, _archive-v5, modules, decisions, .git, node_modules, __pycache__]
  scan_paths: [engines, standalone, shared, reviewers, governance-tools, .claude, README.md, GOVERNANCE-FACTORY-REFERENCE.md]
  neutral_paths: [engines, standalone, shared, reviewers, .claude, README.md, GOVERNANCE-FACTORY-REFERENCE.md]
                                   # tool-repo RENDERED output must be project-neutral: the active
                                   # profile's identity id/display may not appear (C2-project-literal)
  forbidden_terms:                 # concepts removed by blueprint v6 — must not appear outside history/
    - P4.1
    - P4.2
    - P-REG
    - ui-shell
    - ui_shell
    - /audit
    - MASTER-REVIEWER
    - FACTORY-PRECEDENCE
    - journey ledger
    - journey_loader
    - Google Drive
    - GOVERNANCE-ROOT
    - "_ref/"
    - platform-standards.md
    - Claude Projects
  profile_terms_forbidden_in: [engines, standalone, shared, reviewers, governance-tools]   # domain vocabulary must come from the profile, never be typed
  profile_terms_exempt: [governance-tools/tests]   # the tests' OWN fixtures (a sample project, a clinic profile) are the
                                                   # one place a profile's words may be typed — they ARE the profile under test
  profile_term_sources:            # which profile values are treated as forbidden literals (multi-char, distinctive)
    - conventions.entity_defaults
    - conventions.security_model.page_registry
    - stack.backend.framework
    - stack.frontend.framework
    - stack.mobile.framework
    - stack.frontend.libraries
    - stack.db.dialects
  code_paths: [governance-tools]   # python: no stage ids / phase keys / id prefixes as literals
