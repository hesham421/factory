# ════════════════════════════════════════════════════════════════════════════
# profiles/erp.yaml — the ERP domain as DATA (one profile among many)
# ----------------------------------------------------------------------------
# Every ERP-specific fact that used to be hardcoded in engines, shared docs
# and the track toolsets now lives here. Validated by profiles/_schema.yaml.
# ════════════════════════════════════════════════════════════════════════════
schema_version: 6

identity:
  id: erp
  display: ERP Platform
  description: Multi-module enterprise resource planning platform (organization, security, procurement, finance, HR, inventory, sales, contracts).

languages:
  all: [ar, en]
  primary: ar
  require_all: true                 # bilingual artifacts; English-only = incomplete

vocabulary:
  module_prefixes:                    # living registry, not a closed catalog — a code named
                                       # during a run but missing here flows through as RESERVED
                                       # (shared/GOVERNANCE-CORE.md §2); add it here whenever convenient
    ORG: Organization
    SEC: Security
    MDL: Master Data Lookup
    PRC: Procurement
    FIN: Finance
    HR:  Human Resources
    INV: Inventory
    SLS: Sales
    CTR: Contracts
  keyword_map:                      # optional detection aid for P0, not a closed rule — a
                                     # module with no entry here is still matched via
                                     # domain-profile components + layer heuristics (engines/P0)
    PRC: [مشتريات, procurement, vendors, suppliers]
    HR:  [موظفين, HR, رواتب, payroll, employees]
    INV: [مخزون, inventory, warehouses, stock]
    FIN: [محاسبة, finance, accounts, ledger]
    SLS: [مبيعات, sales, customers]
    CTR: [عقود, contracts, agreements]
    ORG: [هيكل تنظيمي, org, branches, departments]
  entity_kinds: [master, transactional, lookup, config, security]
  glossary:
    Module: A bounded functional area with its own registry, entities and screens, identified by a module code.
    Composite Screen: Search + Entry (or Master + Detail, Wizard) treated as ONE screen with ONE SCR-ID.
    XM: A cross-module dependency (HARD-FK or SOFT-READ) declared by the consuming module.
    LOV: List of values loaded at runtime from the lookup module — never hardcoded.
  bounded_contexts:                 # starting grouping, not a fixed partition — a new module
                                     # can join an existing context or start a new one; only
                                     # a tiering deviation from it needs an ADR (XM-PROTOCOL.md)
    - {id: organization, owns: [ORG, SEC, MDL]}
    - {id: supply,       owns: [PRC, INV]}
    - {id: finance,      owns: [FIN]}
    - {id: people,       owns: [HR]}
    - {id: commercial,   owns: [SLS, CTR]}

tracks:
  backend:
    plans:
      exec:
        phases:
          - {key: CORE,     display: CORE,      never_split: true}
          - {key: DATA-DOM, display: DATA+DOM,  sub_labels: [MASTER, TRANSACTIONAL, LOOKUP]}   # entities ≥ 5 (engine self-check; not marker-countable)
          - {key: SVC-API,  display: SVC+API,   split_threshold: {kind: API, count: 8, op: ">=", grouping: "CRUD / SEARCH / INT"}, sub_labels: [CRUD, SEARCH, INT]}
          - {key: DOC,      display: DOC,       never_split: true}
          - {key: INT-C,    display: INT-C,     split_threshold: {kind: XM, count: 5, op: ">=", grouping: per target module}}
          - {key: INT-R,    display: INT-R,     split_threshold: {kind: XM, count: 5, op: ">=", grouping: per target module}}
          - {key: SEC-BE,   display: SEC-BE,    never_split: true}
          - {key: ALIGN-BE, display: ALIGN-BE,  never_split: true}
      test:
        phases:
          - {key: TEST-PLAN-BE, split_threshold: {kind: TC, count: 12, op: ">", grouping: "RULE-SCENARIOS / API-SCENARIOS"}, sub_labels: [RULE-SCENARIOS, API-SCENARIOS]}
          - {key: INT-XM,       display: INT-XM,     integration: true, split_threshold: {kind: TC, count: 8, op: ">", grouping: "per target module"}}
  frontend:
    plans:
      exec:
        phases:
          - {key: F1,       display: "F1 — Models & Types",   sub_bearing: true, split_threshold: {kind: SCR, count: 5, op: ">="}}
          - {key: F2,       display: "F2 — Data Hooks",       sub_bearing: true, split_threshold: {kind: SCR, count: 5, op: ">="}}
          - {key: F3,       display: "F3 — Forms & Validators", sub_bearing: true, split_threshold: {kind: SCR, count: 5, op: ">="}}
          - {key: F4,       display: "F4 — Screens & Routes", sub_bearing: true, split_threshold: {kind: SCR, count: 5, op: ">="}}
          - {key: SEC-FE,   never_split: true}
          - {key: ALIGN-FE, never_split: true}
      test:
        phases:
          - {key: TEST-PLAN-FE, split_threshold: {kind: TC, count: 8, op: ">", grouping: "UI-FLOWS / INT-FLOW"}, sub_labels: [UI-FLOWS, INT-FLOW]}
          - {key: INT-UXD,      display: INT-UXD,    integration: true, split_threshold: {kind: TC, count: 8, op: ">", grouping: "per source module"}}

stack:
  db:
    dialects: [postgresql16, oracle19c]      # both syntax rows kept
    target_dialect: postgresql16             # stated, not inferred from the list order
    delete_semantics: soft                   # deactivate via the active flag; hard delete only where the SRS mandates it
    pk_generation: sequence                  # this ERP targets a database whose already-applied
                                             # migrations build every PK on a named sequence; a second
                                             # strategy cannot be introduced beside them (see naming.
                                             # sequence_pattern + syntax_map.sequence / syntax_map.pk)
    required_marker: NOT NULL                # how the db-script marks a column required
    naming:
      flag_suffix: Fl                        # isActiveFl
      audit_fields: [createdBy, createdAt, updatedBy, updatedAt]
      pk_pattern: "{entity}Pk"
      sequence_pattern: "SEQ_{TABLE}"        # one sequence per table; {TABLE} = the physical table name
    syntax_map:
      identity:   {postgresql16: "GENERATED ALWAYS AS IDENTITY", oracle19c: "GENERATED BY DEFAULT AS IDENTITY"}
      sequence:   {postgresql16: "CREATE SEQUENCE {name} START WITH 1 INCREMENT BY 1 CACHE 1 NO CYCLE;", oracle19c: "CREATE SEQUENCE {name} START WITH 1 INCREMENT BY 1 NOCACHE NOCYCLE;"}
      pk:         {postgresql16: "BIGINT",     oracle19c: "NUMBER(19)"}
      string:     {postgresql16: "VARCHAR(n)",  oracle19c: "VARCHAR2(n CHAR)"}
      boolean:    {postgresql16: "BOOLEAN",     oracle19c: "NUMBER(1)"}
      timestamp:  {postgresql16: "TIMESTAMPTZ", oracle19c: "TIMESTAMP WITH TIME ZONE"}
      decimal:    {postgresql16: "NUMERIC(p,s)", oracle19c: "NUMBER(p,s)"}
      text:       {postgresql16: "TEXT",        oracle19c: "CLOB"}
  backend:
    framework: spring-boot-java
    api:
      base_path: "/api/v1/{module}/{resource}"
      verbs: {POST: create, GET: read, PUT: update, DELETE: deactivate (soft), PATCH: partial}
      envelope: "ApiResponse<T>"
      paging: "Page<T>"
      error_envelope: "LocalizedException → {code, messageAr, messageEn}"
      error_code_format: "{MOD}-{http}[-{SLUG}]"  # e.g. SEC-409-USER-DUP, SEC-500 ; {http} = the row's HTTP
                                             # status, {SLUG} = SCREAMING-KEBAB, [ ] = optional half.
                                             # {SLUG} = SCREAMING-KEBAB. The plan states this format once
                                             # and every catalog code must match it (analyze: code-format).
      http_statuses: [200, 201, 400, 401, 403, 404, 409, 413, 415, 422, 500]
                                             # the statuses this platform can emit — READ OFF the platform's
                                             # own published "Status -> HTTP Status Reference" table in the
                                             # api-docs the backend repo publishes (factory.inputs.api-docs),
                                             # which the contracts already treat as the authority (C8/C11).
                                             # It is module-independent and shared, so it governs every
                                             # module. A catalog row whose {http} is outside it is raisable
                                             # by no code path: the shipped FIN catalog carried a 503 this
                                             # enum has no member for, and it was struck during
                                             # implementation. Correct THIS list from that table when the
                                             # platform changes — never the rows checked against it.
    layers: [controller, service, mapper, domain, repository]
  frontend:
    framework: react-ts-vite
    libraries:
      routing: react-router
      server-state: tanstack-query
      forms: react-hook-form
      validation: zod
      state: "useState/useReducer + Context (no global store by default)"
    lazy_chunk_per: composite-screen
  mobile:
    framework: flutter-dart
  testing:
    backend: agnostic                        # framework chosen by the consumer repo; test-gen emits framework-neutral TC specs
    frontend: agnostic
    manifest: true                           # emit test-execution-manifest for api-verify

conventions:
  entity_defaults:
    master:        [nameAr, nameEn, code, isActiveFl, createdBy, createdAt, updatedBy, updatedAt]
    transactional: [docNo, docDate, statusCode, fiscalYearId, periodId, createdBy, createdAt, updatedBy, updatedAt]
    lookup:        [code, nameAr, nameEn, sortOrder, isActiveFl]
    config:        [key, valueAr, valueEn, isActiveFl]
  security_model:
    page_registry: SEC_PAGES
    permission_pattern: "PERM_<PAGE_CODE>_<ACTION>"
    actions: [VIEW, CREATE, UPDATE, DELETE]
    gateway_action: VIEW                     # without VIEW no other permission applies
    grant_target: role                       # a permission is granted TO a role. Registering a page and
                                             # minting a permission name is not a grant: the shipped
                                             # module did both and every endpoint answered forbidden to
                                             # every caller, the administrator included.
  composite_screen: true
  numbering: "document numbers come from the platform numbering engine; never generated in a module"
  lookups: "all LOV values runtime-loaded from the lookup module; no hardcoded enums in APIs or field specs"
  workflow_engine: forbidden
  module_interface: in_process               # this platform is ONE deployable: modules reach each other
                                             # through published in-process interfaces, injected. The
                                             # template used to offer "DB foreign key | REST call" and a
                                             # plan answered "REST call" — six files, a planned HTTP
                                             # client and an error-catalog row for a network failure that
                                             # cannot occur followed from that one word.
  domain_behaviour_placement: domain_classes   # consistent with stack.backend.layers, which already
                                               # declares `domain` as its own layer

plan_vocabulary:                           # the labels the plans use on the lines the checks read;
                                           # the engine renders these same values, so neither side can
                                           # drift into looking for a line the other never writes.
  request_line: Request
  effect_line: Orchestration
  operations_line: OPERATIONS
  present_token: "✓"
  exclusion_reasons: [system-generated, derived, seeded, DEFERRED]

bootstrap_data:                            # what must exist in the database before any endpoint of the
                                           # module can succeed. Absent this section the delivered module
                                           # was unusable on a fresh database: its lookup tables belong to
                                           # another module, so the seed block that only covers tables this
                                           # script creates was empty and nothing ever seeded them.
  section: BOOTSTRAP DATA
  items:
    - {label: lookup key, column: "Lookup key", declared_in: backend-execution-plan, source_label: seed source}
    - {label: permission, names: conventions.security_model.permission_pattern, declared_in: backend-execution-plan, source_label: grant target}

declared_totals:                           # every total the plan hand-counts, and the rows it heads.
                                           # One shipped file asserted "147 DBF" and "Total: 146" in the
                                           # same module and the self-check certified both: nothing in
                                           # the factory counted anything (analyze: count-agrees).
  - {artifact: backend-execution-plan, label: "DBF ROWS",  kind: DBF, rows_in: db-script}
  - {artifact: backend-execution-plan, label: "XM ROWS",   kind: XM,  rows_in: db-script}
  - {artifact: backend-execution-plan, label: "API ROWS",  kind: API}
  - {artifact: backend-execution-plan, label: "QR ROWS",   kind: QR}

forward_columns:                           # the backend plan names request/response types for an
                                           # implementation that does not exist yet; the real api-docs,
                                           # published after implementation, is where they resolve.
                                           # 14 of 27 rows in the shipped SEC table named types that
                                           # never existed — each one indistinguishable from a decision.
  - {artifact: backend-execution-plan, column: "Request DTO",  resolved_from: api-docs}
  - {artifact: backend-execution-plan, column: "Response DTO", resolved_from: api-docs}

self_check:                                # the verdict line inside the plan; the ORCHESTRATOR writes it
  block: ALIGN                             # from the analyze report (gov.py), the author leaves it alone.
  verdict_label: RESULT                    # `verdict-agrees` (C7.15/C9.12) guards it for anything still
  pass_token: "PASSED ✓"                   # hand-authored: a plan may not claim fewer findings than the
  fail_token: "BLOCKED ✗"                  # machine produced for it. The shipped SEC plan said
  findings_noun: findings                  # "PASSED ✓ — 0 findings" over six real ones.

knowledge:
  files:
    - profiles/erp/knowledge/erp-domain-standards.md   # replaces the former platform-standards.md §M

review:
  extra_checks:
    - {id: ERP-1, stage: P1,   check: "every master entity carries the master entity_defaults", severity: MAJOR}
    - {id: ERP-2, stage: P1,   check: "every screen maps to exactly one composite SCR and one SEC_PAGES row", severity: MAJOR}
    - {id: ERP-3, stage: P2,   check: "every flag column ends with the flag_suffix", severity: MINOR}
    - {id: ERP-4, stage: P3.1, check: "every mutation endpoint declares its PERM_* requirement", severity: MAJOR}
    - {id: ERP-5, stage: P3.1, check: "CORE states domain-behaviour placement as the single value conventions.domain_behaviour_placement declares, for every rule alike — no split by entity count, and the service layer never named as a placement", severity: CRITICAL}
    - {id: ERP-6, stage: P3.1, check: "every cross-module row states the access mechanism conventions.module_interface declares — no per-row choice, no HTTP client and no network error path where the platform is one deployable", severity: CRITICAL}
