# ════════════════════════════════════════════════════════════════════════════
# profiles/_schema.yaml — what every domain profile MUST / MAY declare (C5)
# ----------------------------------------------------------------------------
# A domain is DATA. Engines never mention a domain; they read {{profile.*}}.
# `gov.py lint --profile <id>` validates a profile against this schema.
# `gov.py new-domain <id>` scaffolds a profile from it.
#
# Type strings: str | int | bool | list[T] | map[K, V] | (a|b) = one of ;
# a key ending in `?` is optional. `$phase` refers to the `phase` type below.
# ════════════════════════════════════════════════════════════════════════════
schema_version: 6

identity:                                   # REQUIRED
  id: "str"                                 # slug, = filename stem
  display: "str"
  description: "str"

languages:                                  # REQUIRED
  all: "list[str]"                          # ISO 639-1 codes, e.g. [ar, en]
  primary: "str"                            # must be in `all`
  require_all: "bool"                       # true → every artifact carries every language

vocabulary:                                 # REQUIRED — the domain's ubiquitous language (DDD)
  module_prefixes: "map[str, str]"          # code → display, e.g. ORG: Organization
  keyword_map?: "map[str, list[str]]"       # module code → free-text keywords (any language) P0 uses to detect modules
  entity_kinds: "list[str]"                 # e.g. [master, transactional, lookup, config]
  glossary?: "map[str, str]"                # term → definition (used verbatim by every stage)
  bounded_contexts?: "list[{id: str, owns: list[str]}]"

ids?:                                       # OPTIONAL — domain atoms ADDED to factory.yaml ids.atoms
  atoms?: "map[str, {owner: str, title: str, traces_to?: list[str]}]"

tracks:                                     # REQUIRED — phase vocabulary per track and plan
  backend:
    plans:
      exec:
        phases: "list[$phase]"              # ordered; keys are the canonical PHASE marker keys
      test?:
        phases: "list[$phase]"
  frontend:
    plans:
      exec:
        phases: "list[$phase]"
      test?:
        phases: "list[$phase]"

$types:
  phase:
    key: "str"                              # canonical marker key, [A-Z0-9-]+
    display?: "str"                         # human label (may contain '+')
    folder?: "str"                          # package folder, defaults to key
    never_split?: "bool"                    # phase may not carry SUB blocks
    split_threshold?: "{kind: (API|XM|TC|SCR), count: int, op: (>=|>), grouping?: str}"
    sub_labels?: "list[str]"                # expected SUB labels when split (test plans: bare; others: phase-qualified)
    sub_bearing?: "bool"                    # frontend: per-screen SUB blocks expected
    integration?: "bool"                    # test plans: populated only when the run's scope spans
                                             # more than one module (a cross-module TC phase)

stack:                                      # REQUIRED — every technology fact lives here
# ── Stated choices (F5a) ───────────────────────────────────────────────────
# Every key below has MORE THAN ONE valid answer and is restated in a generated
# artifact. Each is therefore REQUIRED, never optional with an engine-side default:
# a default nobody chose is indistinguishable downstream from a decision that was
# made, and the implementer inherits it with no way to tell which it was. A profile
# that omits one is a lint finding (C5-profile, "required key missing"), and the
# engine emits the profile's answer — it encodes no answer of its own.
  db:
    dialects: "list[str]"                   # every dialect whose syntax rows are kept
    target_dialect: "str"                   # WHICH of `dialects` the generated script targets — must be
                                             # one of them. Taking the first element was a silent default:
                                             # a profile listing two dialects has a real choice, and the
                                             # generated DDL restates the answer in every type it emits.
    pk_generation: "(identity|sequence)"    # HOW primary keys are generated — a PROFILE decision,
                                             # never a dialect default. `identity` = the dialect's identity
                                             # clause (syntax_map.identity); `sequence` = one named sequence
                                             # per table (syntax_map.sequence + naming.sequence_pattern) with
                                             # the PK column declared as syntax_map.pk. A profile whose target
                                             # database already holds tables built on named sequences declares
                                             # `sequence`; a greenfield one may prefer `identity`.
    delete_semantics: "(soft|hard)"         # WHAT a delete does — restated at every delete endpoint. It used
                                             # to be inferred from whether `naming.flag_suffix` happened to be
                                             # declared: a semantic decision derived from an unrelated naming
                                             # key is the same defect one step further removed.
    naming?: "{flag_suffix?: str, audit_fields?: list[str], pk_pattern?: str, sequence_pattern?: str}"
    syntax_map?: "map[str, map[str, str]]"  # type → dialect → syntax ; the rows `identity`, `sequence`
                                             # and `pk` are read by the pk_generation rule above
  backend:
    framework: "str"                        # e.g. spring-boot-java
    api:
      base_path: "str"                      # e.g. /api/v1/{module}/{resource}
      verbs: "map[str, str]"                # POST: create, GET: read, PUT: update, DELETE: deactivate, PATCH: partial
      envelope?: "str"                      # response wrapper name
      paging?: "str"                        # e.g. Page<T>
      error_envelope?: "str"
      error_code_format?: "str"             # SHAPE of a runtime error code, as a template over the tokens
                                             # {MOD} {http} {SLUG} {seq} — the plan states this format and
                                             # every catalog code it emits must match it (analyze: code-format)
    layers?: "list[str]"                    # controller, service, mapper, domain, repository …
  frontend:
    framework: "str"
    libraries?: "map[str, str]"             # routing, server-state, forms, validation, state …
    lazy_chunk_per?: "str"                  # e.g. composite-screen
  mobile?:
    framework: "str"                        # a stack name or NONE
  testing:
    backend?: "str"                         # framework/tool name, or agnostic
    frontend?: "str"
    manifest: "bool"                        # emit test-execution-manifest for api-verify

conventions?:                               # OPTIONAL — absent = not applied (no exceptions in prose)
  entity_defaults?: "map[str, list[str]]"   # entity kind → default fields
  security_model?:
    page_registry: "str"                    # e.g. SEC_PAGES
    permission_pattern: "str"               # e.g. PERM_<PAGE_CODE>_<ACTION>
    actions: "list[str]"
    gateway_action: "str"                   # e.g. VIEW
  composite_screen?: "bool"                 # Search + Entry (+Master/Detail, Wizard) = ONE SCR-ID
  numbering?: "str"                         # numbering-engine rule
  lookups?: "str"                           # lookup/LOV rule (runtime-loaded, no hardcoded enums …)
  workflow_engine?: "(forbidden|allowed)"

self_check?:                                # OPTIONAL — the block a stage artifact carries its OWN
                                             # verdict in. A profile that declares none simply has no
                                             # self-check: the `verdict-agrees` clause never runs and the
                                             # orchestrator stamps nothing. The engine renders these
                                             # values; it never spells them (C2), and no checker knows
                                             # them — they reach it through its clause's `args`.
  block: "str"                              # token the block's header line starts with, e.g. ALIGN
  verdict_label: "str"                      # label of the line that states the verdict, e.g. RESULT
  pass_token: "str"                         # text of a verdict with no findings, e.g. "PASSED ✓"
  fail_token: "str"                         # text of a verdict with findings, e.g. "BLOCKED ✗"
  findings_noun: "str"                      # the word the count is written with, e.g. findings

knowledge?:                                 # OPTIONAL — primary sources the engines may cite
  files?: "list[str]"                       # paths under profiles/<id>/knowledge/

review?:                                    # OPTIONAL — extra domain checks scored at the gate (data, not prose)
  extra_checks?: "list[{id: str, stage: str, check: str, severity: (CRITICAL|MAJOR|MINOR)}]"
