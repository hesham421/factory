name: governance

# The factory's own checks, plus the one thing the shared repo made possible to
# get silently wrong: a checkout whose submodule was never initialised. Nothing
# here builds a product — it verifies that the governance is internally
# consistent, that its generated files are what `gov.py render` would write,
# and that its inputs resolve. Lint is never weakened here: a check that fails
# in CI is answered in factory.yaml or the profile, not in this file.
on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'         # nightly — the whole pipeline, dry-run, no operator

jobs:
  governance:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      # without this the shared repo is an empty
                                     # directory and every input silently vanishes
          fetch-depth: 0

      - name: The shared submodule is actually there
        run: |
          test -n "$(ls -A governance-shared 2>/dev/null)" || {
            echo "::error::governance-shared is empty — the checkout did not init submodules"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml jinja2 pytest

      - name: Lint — the constitution
        run: python governance-tools/gov.py lint

      - name: Render is a no-op on a committed tree
        run: |
          python governance-tools/gov.py render
          git diff --exit-code

      - name: Tests
        run: python -m pytest governance-tools/tests -q

  nightly:
    # The full pipeline, end to end, with no operator: every stage dispatched to
    # the fake runner, both gates auto-reviewed, split, inputs fetched back with
    # their commit recorded, tagged — under a NON-ERP toy profile, so no domain
    # assumption survives into the orchestrator (test_e2e_fake.py).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GOV_RUNNER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml jinja2 pytest
      - name: Full pipeline dry-run — toy profile, fake runner, no operator step
        run: python -m pytest governance-tools/tests/test_e2e_fake.py -q
