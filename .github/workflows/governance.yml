name: governance

# The tool's own checks. The factory is a pure tool: it carries no project, so
# CI drives it against the tests' own fixture project (the same one every test
# builds a temp copy of). Because tool-rendered output is project-neutral, a
# render under that project must leave the committed tree unchanged. Lint is
# never weakened here: a check that fails in CI is answered in factory.yaml or
# the profile, not in this file.
on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'         # nightly — the whole pipeline, dry-run, no operator

env:
  GOV_PROJECT_CHECKOUT: governance-tools/tests/fixtures/project

jobs:
  governance:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml jinja2 pytest

      - name: Lint — the constitution
        run: python governance-tools/gov.py lint

      - name: Render is a no-op on a committed tree (and project-neutral)
        run: |
          python governance-tools/gov.py render
          git diff --exit-code

      - name: Tests
        run: python -m pytest governance-tools/tests -q

  nightly:
    # The full pipeline, end to end, with no operator: a project repo scaffolded
    # on the fly with the NON-ERP toy profile, every stage dispatched to the fake
    # runner, both gates auto-reviewed, split, inputs fetched back with their
    # commit recorded, tagged in the project repo (test_e2e_fake.py).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GOV_RUNNER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml jinja2 pytest
      - name: Full pipeline dry-run — toy project, fake runner, no operator step
        run: python -m pytest governance-tools/tests/test_e2e_fake.py -q
